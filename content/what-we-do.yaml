traits:
  - id: systems-thinker
    title: "Systems Thinkers"
    description: "People interested in how software, electrical, and mechanical systems interact."
    relatedDomains:
      - autonomous-systems
      - embedded

  - id: builders
    title: "Builders"
    description: "People who enjoy turning theory into something physical and measurable."
    relatedDomains:
      - embedded
      - robot-design

  - id: problem-solvers
    title: "Problem Solvers"
    description: "People willing to approach ambiguous technical problems and learn what they need."
    relatedDomains:
      - autonomous-systems
      - competition-research

  - id: research-minded
    title: "Research-Minded Engineers"
    description: "People interested in reading, experimenting, comparing approaches, and improving existing methods."
    relatedDomains:
      - autonomous-systems
      - competition-research

  - id: ownership
    title: "Ownership"
    description: "People willing to become responsible for a system or subsystem."
    relatedDomains:
      - embedded
      - competition-research

  - id: collaborators
    title: "Collaborators"
    description: "People who communicate technical ideas well and can work across disciplines."
    relatedDomains:
      - robot-design

  - id: curiosity
    title: "Curiosity"
    description: "People who genuinely want to understand why something works instead of stopping when it merely works."
    relatedDomains:
      - competition-research

