sectionLabel: "03 / WHAT WE DO"
heading: "The work."

domains:
  - id: autonomous-systems
    title: "Autonomous Systems"
    description: "Machine intelligence, strategy, perception, world modelling, planning, state estimation, control, simulation, and multi-robot coordination."
    tag: "AI / SOFTWARE"

  - id: embedded
    title: "Embedded & Electrical"
    description: "Embedded systems, custom PCBs, sensing, communication, motor electronics, firmware, and power systems."
    tag: "ELECTRICAL"

  - id: robot-design
    title: "Robot Design"
    description: "CAD, drivetrain, mechanisms, kicking, dribbling, manufacturing, packaging, and physical integration."
    tag: "MECHANICAL"

  - id: competition-research
    title: "Competition & Research"
    description: "RoboCup, experimentation, benchmarking, testing, technical research, and iteration."
    tag: "RESEARCH"

joinSectionLabel: "03B / JOIN US"
