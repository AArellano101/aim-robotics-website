sectionLabel: "01 / ABOUT"

heading: "TARGETING THE HIGHEST STANDARD"

mission: >
  We believe the highest standard is not a fixed destination, but a benchmark that continually moves forward. AIM strives to reach that benchmark by learning from leading teams and developing innovative approaches, while giving our members the oppurtunity to bring them to life. Through constant refinement, we aim to raise our capabilities with every iteration and earn our place among the best in RoboCup.

goals:
  - number: "01"
    title: "INGENUITY"
    description: "Drawing from the successes of teams around the world, AIM combines proven approaches with our own ideas to develop creative and unconventional engineered solutions."

  - number: "02"
    title: "DEVELOPMENT"
    description: "We are committed to building a sustainable team where members grow through collaboration and hands-on experience, developing the skills needed to take on increasingly complex challenges."

  - number: "03"
    title: "COMPETITION"
    description: "AIM strives to compete at the highest level of RoboCup SSL, using competition as a benchmark for our engineering and pushing ourselves to perform alongside the world’s strongest teams and compete for top placements."
