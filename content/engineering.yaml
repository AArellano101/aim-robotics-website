roboCupLabel: "SYSTEM // ROBOCUP SSL"
roboCupIntro: >
  RoboCup is an international competition designed to advance robotics and
  artificial-intelligence research through challenging autonomous-robotics
  problems.
roboCupDetail: >
  AIM is developing a team for the RoboCup Small Size League, where teams of
  fully autonomous robots play soccer while receiving field-state information
  through the league's shared vision infrastructure and operating under
  automated game-control systems.

