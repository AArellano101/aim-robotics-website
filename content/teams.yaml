sectionLabel: "05 / TEAMS"
heading: "One system. Multiple disciplines."
intro: >
  AIM consists of a collection of integrated subteams that distribute responsibilities and work in parallel toward a common goal. These subteams include Mechanical, Electrical, Software, and Administration, with each contributing specialized expertise to the development of the robot and the team as a whole.

subteams:
  - id: software-ai
    title: "Software & AI"
    description: "Strategy, artificial intelligence, planning, state estimation, control systems, firmware."
    tag: "SOFTWARE"

  - id: electrical-embedded
    title: "Electrical & Embedded Systems"
    description: "PCB design, sensing, wireless communication, power management, and hardware-software integration."
    tag: "ELECTRICAL"

  - id: mechanical
    title: "Mechanical Systems"
    description: "Solenoid kicker, wheel-based dribbler, omnidirectional wheels, 3D printed shell."
    tag: "MECHANICAL"

  - id: operations
    title: "Administrative"
    description: "Competition logistics, recruitment, sponsorship, outreach, media, and organization."
    tag: "Administrative"

centerLabel: "AIM ROBOT"
